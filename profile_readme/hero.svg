<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 260" width="830" height="260">
  <defs>
    <!-- Softened Antique Brass Gradient -->
    <linearGradient id="brassSoft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DEC07E"/>
      <stop offset="40%" stop-color="#C8A45A"/>
      <stop offset="100%" stop-color="#8C6F2D"/>
    </linearGradient>

    <!-- Calmed Cognac Trunk Leather -->
    <linearGradient id="trunkLeather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4E2B18"/>
      <stop offset="40%" stop-color="#3B1E10"/>
      <stop offset="100%" stop-color="#241209"/>
    </linearGradient>

    <!-- Calmed Dark Saddle Leather Straps -->
    <linearGradient id="strapLeather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22130A"/>
      <stop offset="100%" stop-color="#140A04"/>
    </linearGradient>

    <!-- Calmed British Racing Green Briefcase -->
    <linearGradient id="briefcaseGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B3828"/>
      <stop offset="40%" stop-color="#12271C"/>
      <stop offset="100%" stop-color="#0B1711"/>
    </linearGradient>

    <!-- Calmed IBM Slate Bezel -->
    <linearGradient id="ibmBezel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#332F2B"/>
      <stop offset="50%" stop-color="#25221F"/>
      <stop offset="100%" stop-color="#171513"/>
    </linearGradient>
  </defs>

  <!-- Panel Base: Deep Warm Leather/Wood (#17130F) with Hairline Border -->
  <rect x="0.5" y="0.5" width="829" height="259" rx="10" fill="#17130F" stroke="#3A3126" stroke-width="1"/>
  <rect x="5.5" y="5.5" width="819" height="249" rx="7" fill="none" stroke="#251E17" stroke-width="1"/>

  <!-- Left Content Column -->
  <g transform="translate(36, 0)">
    <!-- Label: // secbymorchid -->
    <text x="0" y="46" font-family="ui-monospace, 'SF Mono', Consolas, Menlo, monospace" font-size="13" font-weight="600" fill="#C8A45A" letter-spacing="2px">// SECBYMORCHID</text>

    <!-- Regal Executive Headline -->
    <text x="0" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="#EFE8D8" letter-spacing="1.5px">MOAD MORCHID</text>

    <!-- Hairline Brass Accent Rule -->
    <line x1="0" y1="116" x2="160" y2="116" stroke="#C8A45A" stroke-width="1.2" opacity="0.7"/>
    <line x1="160" y1="116" x2="520" y2="116" stroke="#3A3126" stroke-width="1"/>

    <!-- Subtitle (One clean line, comfortable breathing space, never cut off) -->
    <text x="0" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#EFE8D8">Information Systems Governance · Risk &amp; Cyber Assessment · IT Project Management</text>

    <!-- Student Affiliation -->
    <text x="0" y="184" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="400" fill="#BDB29C">MGSI engineering student at ENSA Oujda (class of 2027)</text>

    <!-- Subdued Dossier Tagline -->
    <g transform="translate(0, 220)">
      <circle cx="4" cy="-4" r="3" fill="#C8A45A" opacity="0.8"/>
      <text x="16" y="0" font-family="ui-monospace, 'SF Mono', Consolas, Menlo, monospace" font-size="13" font-weight="500" fill="#C8A45A" letter-spacing="0.8px">GOVERNANCE-MINDED · STRUCTURED · TECHNICALLY CREDIBLE</text>
    </g>
  </g>

  <!-- Right Visual: Signature Old Money Leather & Calmed IBM Terminal Enclave -->
  <!-- Scaled cleanly to 0.49 and positioned at x=605, y=44 so there is over 50px whitespace with the text -->
  <g transform="translate(605, 44) scale(0.49)">
    <!-- Base Mahogany Surface and Drop Shadows -->
    <ellipse cx="205" cy="254" rx="195" ry="12" fill="#000000" opacity="0.45"/>
    <rect x="0" y="248" width="415" height="12" rx="2" fill="#18110B" stroke="#2B1A10" stroke-width="1"/>
    <line x1="0" y1="248" x2="415" y2="248" stroke="#C8A45A" stroke-width="0.8" stroke-opacity="0.25"/>

    <!-- 1. The Heritage Cognac Steamer Trunk (Base Foundation) -->
    <g id="cognacTrunk">
      <rect x="8" y="160" width="398" height="88" rx="6" fill="url(#trunkLeather)" stroke="#3A1C0B" stroke-width="1.2"/>
      <line x1="14" y1="162" x2="400" y2="162" stroke="#FFFFFF" stroke-width="0.6" opacity="0.08"/>

      <line x1="8" y1="184" x2="406" y2="184" stroke="#140803" stroke-width="2"/>
      <line x1="8" y1="185.5" x2="406" y2="185.5" stroke="#C8A45A" stroke-width="0.5" stroke-opacity="0.35"/>

      <!-- Vertical Leather Straps -->
      <rect x="74" y="160" width="22" height="88" fill="url(#strapLeather)" stroke="#100602" stroke-width="0.8"/>
      <line x1="77" y1="160" x2="77" y2="248" stroke="#C8A45A" stroke-dasharray="2,2" stroke-width="0.6" stroke-opacity="0.6"/>
      <line x1="93" y1="160" x2="93" y2="248" stroke="#C8A45A" stroke-dasharray="2,2" stroke-width="0.6" stroke-opacity="0.6"/>
      <rect x="71" y="179" width="28" height="12" rx="2" fill="none" stroke="url(#brassSoft)" stroke-width="1.6"/>
      <line x1="85" y1="179" x2="85" y2="191" stroke="#E8D29B" stroke-width="1.2"/>

      <rect x="318" y="160" width="22" height="88" fill="url(#strapLeather)" stroke="#100602" stroke-width="0.8"/>
      <line x1="321" y1="160" x2="321" y2="248" stroke="#C8A45A" stroke-dasharray="2,2" stroke-width="0.6" stroke-opacity="0.6"/>
      <line x1="337" y1="160" x2="337" y2="248" stroke="#C8A45A" stroke-dasharray="2,2" stroke-width="0.6" stroke-opacity="0.6"/>
      <rect x="315" y="179" width="28" height="12" rx="2" fill="none" stroke="url(#brassSoft)" stroke-width="1.6"/>
      <line x1="329" y1="179" x2="329" y2="191" stroke="#E8D29B" stroke-width="1.2"/>

      <!-- Center Brass Clasp -->
      <rect x="190" y="174" width="34" height="24" rx="3" fill="url(#brassSoft)" stroke="#6B5117" stroke-width="0.8"/>
      <rect x="201" y="170" width="12" height="9" rx="1.5" fill="url(#brassSoft)" stroke="#6B5117" stroke-width="0.6"/>
      <circle cx="207" cy="183" r="2.2" fill="#170E07"/>

      <!-- Center Stitched Leather Handle -->
      <rect x="180" y="208" width="54" height="13" rx="6.5" fill="#2B150A" stroke="#160803" stroke-width="0.9"/>
      <line x1="184" y1="214.5" x2="230" y2="214.5" stroke="#C8A45A" stroke-dasharray="2,2" stroke-width="0.5" stroke-opacity="0.55"/>
      <rect x="177" y="209" width="6" height="11" rx="1.5" fill="url(#brassSoft)" stroke="#6B5117" stroke-width="0.5"/>
      <rect x="231" y="209" width="6" height="11" rx="1.5" fill="url(#brassSoft)" stroke="#6B5117" stroke-width="0.5"/>

      <!-- Diplomatic Luggage Tag -->
      <path d="M 85 191 Q 72 205 66 216" fill="none" stroke="#C8A45A" stroke-width="0.9"/>
      <g transform="translate(42, 212) rotate(-8 23 12)">
        <rect x="0" y="0" width="52" height="24" rx="2.5" fill="#4E2B18" stroke="#C8A45A" stroke-width="0.8"/>
        <circle cx="6" cy="12" r="1.8" fill="none" stroke="#E8D29B" stroke-width="0.7"/>
        <text x="12" y="11" font-family="ui-monospace, monospace" font-size="6.5" font-weight="700" fill="#E8D29B">ENSAO</text>
        <text x="12" y="19" font-family="ui-monospace, monospace" font-size="5.5" font-weight="600" fill="#C9C1B5">MGSI · GRC</text>
      </g>

      <!-- Brass Corner Reinforcements -->
      <path d="M 8 180 L 8 160 L 28 160 C 28 166 22 172 16 180 Z" fill="url(#brassSoft)" stroke="#6B5117" stroke-width="0.6"/>
      <path d="M 406 180 L 406 160 L 386 160 C 386 166 392 172 398 180 Z" fill="url(#brassSoft)" stroke="#6B5117" stroke-width="0.6"/>
      <path d="M 8 228 L 8 248 L 28 248 C 28 242 22 236 16 228 Z" fill="url(#brassSoft)" stroke="#6B5117" stroke-width="0.6"/>
      <path d="M 406 228 L 406 248 L 386 248 C 386 242 392 236 398 228 Z" fill="url(#brassSoft)" stroke="#6B5117" stroke-width="0.6"/>
    </g>

    <!-- 2. The Vintage IBM 5100 Retro Terminal (Top Left) -->
    <g id="ibmTerminal">
      <polygon points="12,24 24,12 211,12 204,24" fill="#332F2B" stroke="#3D3833" stroke-width="0.7"/>
      <polygon points="204,24 211,12 211,146 204,158" fill="#171513" stroke="#2B2723" stroke-width="0.7"/>

      <g stroke="#141311" stroke-width="1.1">
        <line x1="38" y1="15" x2="198" y2="15"/>
        <line x1="38" y1="18" x2="198" y2="18"/>
        <line x1="38" y1="21" x2="198" y2="21"/>
      </g>

      <rect x="12" y="24" width="192" height="134" rx="5" fill="url(#ibmBezel)" stroke="#38342F" stroke-width="1"/>

      <rect x="22" y="30" width="34" height="12" rx="1.5" fill="#0E1B26" stroke="#2563EB" stroke-width="0.7"/>
      <text x="39" y="39" font-family="'Courier New', Courier, monospace" font-size="8.5" font-weight="900" fill="#60A5FA" text-anchor="middle" letter-spacing="1.2px">IBM</text>

      <rect x="60" y="30" width="58" height="12" rx="1.5" fill="#17130F" stroke="#C8A45A" stroke-width="0.7"/>
      <text x="89" y="39" font-family="ui-monospace, monospace" font-size="7" font-weight="700" fill="#C8A45A" text-anchor="middle">5100 · SEC/OS</text>

      <rect x="22" y="46" width="138" height="84" rx="10" fill="#0F0E0D" stroke="#24211D" stroke-width="1.2"/>

      <rect x="26" y="50" width="130" height="76" rx="7" fill="#0A140F" stroke="#162E20" stroke-width="0.8"/>

      <text x="32" y="62" font-family="ui-monospace, Menlo, monospace" font-size="7.2" font-weight="600" fill="#7FA88E">> IBM-SYS // MGSI.OS v4.2</text>
      <text x="32" y="73" font-family="ui-monospace, Menlo, monospace" font-size="6.6" font-weight="500" fill="#5E8F72">[+] AUTH: SECBYMORCHID [OK]</text>
      <text x="32" y="83" font-family="ui-monospace, Menlo, monospace" font-size="6.6" font-weight="500" fill="#5E8F72">[+] SOVEREIGN RISK: AUDIT OK</text>
      <text x="32" y="93" font-family="ui-monospace, Menlo, monospace" font-size="6.6" font-weight="500" fill="#5E8F72">[+] DECEPTION MESH: ARMED</text>
      <text x="32" y="103" font-family="ui-monospace, Menlo, monospace" font-size="6.6" font-weight="500" fill="#5E8F72">[+] SOC TELEMETRY: ACTIVE</text>
      <text x="32" y="116" font-family="ui-monospace, Menlo, monospace" font-size="7.5" font-weight="700" fill="#7FA88E">READY &gt;_</text>

      <rect x="166" y="48" width="30" height="42" rx="2" fill="#141311" stroke="#252320" stroke-width="0.7"/>
      <rect x="170" y="56" width="22" height="4" rx="1" fill="#090807" stroke="#2B2825" stroke-width="0.5"/>
      <rect x="170" y="66" width="10" height="5" rx="1" fill="#252320" stroke="#38342F" stroke-width="0.5"/>
      <circle cx="188" cy="68.5" r="1.8" fill="#5E8F72"/>

      <g transform="translate(0, 134)">
        <circle cx="36" cy="11" r="4.5" fill="#171513" stroke="#8C6F2D" stroke-width="0.8"/>
        <line x1="36" y1="7" x2="36" y2="10" stroke="#E8D29B" stroke-width="0.8"/>
        <circle cx="50" cy="11" r="4.5" fill="#171513" stroke="#8C6F2D" stroke-width="0.8"/>
        <line x1="50" y1="7" x2="50" y2="10" stroke="#E8D29B" stroke-width="0.8"/>
        <rect x="66" y="6" width="14" height="10" rx="1.5" fill="#6B2005" stroke="#C8A45A" stroke-width="0.7"/>
        <circle cx="90" cy="11" r="2.8" fill="#5E8F72"/>
        <text x="100" y="14" font-family="ui-monospace, monospace" font-size="6.5" font-weight="600" fill="#9C9286">PWR / COMM</text>
      </g>
    </g>

    <!-- 3. The British Racing Green Briefcase (Top Right) -->
    <g id="racingGreenBriefcase">
      <rect x="228" y="26" width="176" height="132" rx="5" fill="url(#briefcaseGreen)" stroke="#1D3E2B" stroke-width="1.1"/>
      <rect x="233" y="31" width="166" height="122" rx="3.5" fill="none" stroke="#C8A45A" stroke-width="0.6" stroke-dasharray="3,2" stroke-opacity="0.65"/>
      <line x1="228" y1="58" x2="404" y2="58" stroke="#08140E" stroke-width="1.5"/>
      <line x1="228" y1="59" x2="404" y2="59" stroke="#C8A45A" stroke-width="0.4" stroke-opacity="0.3"/>

      <path d="M 300 26 C 300 12 332 12 332 26" fill="none" stroke="#0A160F" stroke-width="5.5" stroke-linecap="round"/>
      <path d="M 300 26 C 300 12 332 12 332 26" fill="none" stroke="#163022" stroke-width="3.8" stroke-linecap="round"/>
      <rect x="296" y="23" width="8" height="8" rx="1.5" fill="url(#brassSoft)" stroke="#6B5117" stroke-width="0.5"/>
      <rect x="328" y="23" width="8" height="8" rx="1.5" fill="url(#brassSoft)" stroke="#6B5117" stroke-width="0.5"/>

      <rect x="293" y="76" width="46" height="20" rx="2" fill="url(#brassSoft)" stroke="#6B5117" stroke-width="0.7"/>
      <text x="316" y="85" font-family="Georgia, serif" font-size="7.5" font-weight="700" fill="#140E06" text-anchor="middle">M. MORCHID</text>
      <text x="316" y="92" font-family="ui-monospace, monospace" font-size="5.2" font-weight="700" fill="#2B1A0A" text-anchor="middle" letter-spacing="0.5px">ENSAO // MGSI</text>

      <rect x="252" y="47" width="16" height="24" rx="2" fill="url(#brassSoft)" stroke="#6B5117" stroke-width="0.7"/>
      <line x1="255" y1="55" x2="265" y2="55" stroke="#170E07" stroke-width="0.7"/>
      <line x1="255" y1="59" x2="265" y2="59" stroke="#170E07" stroke-width="0.7"/>
      <line x1="255" y1="63" x2="265" y2="63" stroke="#170E07" stroke-width="0.7"/>

      <rect x="364" y="47" width="16" height="24" rx="2" fill="url(#brassSoft)" stroke="#6B5117" stroke-width="0.7"/>
      <line x1="367" y1="55" x2="377" y2="55" stroke="#170E07" stroke-width="0.7"/>
      <line x1="367" y1="59" x2="377" y2="59" stroke="#170E07" stroke-width="0.7"/>
      <line x1="367" y1="63" x2="377" y2="63" stroke="#170E07" stroke-width="0.7"/>

      <path d="M 228 42 L 228 26 L 244 26 C 244 32 238 38 228 42 Z" fill="url(#brassSoft)" stroke="#6B5117" stroke-width="0.5"/>
      <path d="M 404 42 L 404 26 L 388 26 C 388 32 394 38 404 42 Z" fill="url(#brassSoft)" stroke="#6B5117" stroke-width="0.5"/>
      <path d="M 228 142 L 228 158 L 244 158 C 244 152 238 146 228 142 Z" fill="url(#brassSoft)" stroke="#6B5117" stroke-width="0.5"/>
      <path d="M 404 142 L 404 158 L 388 158 C 388 152 394 146 404 142 Z" fill="url(#brassSoft)" stroke="#6B5117" stroke-width="0.5"/>
    </g>
  </g>
</svg>