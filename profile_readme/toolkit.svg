<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 190" width="830" height="190">
  <!-- Panel Base: #17130F with Hairline Border #3A3126 -->
  <rect x="0.5" y="0.5" width="829" height="189" rx="8" fill="#17130F" stroke="#3A3126" stroke-width="1"/>
  <rect x="5.5" y="5.5" width="819" height="179" rx="5" fill="none" stroke="#251E17" stroke-width="0.8"/>

  <!-- Section Label -->
  <text x="32" y="34" font-family="ui-monospace, 'SF Mono', Consolas, Menlo, monospace" font-size="13" font-weight="600" fill="#C8A45A" letter-spacing="1.5px">// TECHNICAL &amp; GOVERNANCE TOOLKIT</text>
  <line x1="32" y1="46" x2="798" y2="46" stroke="#3A3126" stroke-width="1"/>

  <!-- Line 1: Governance & architecture -->
  <g transform="translate(32, 80)">
