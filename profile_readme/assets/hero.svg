<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 232" width="830" height="232">
  <defs>
    <linearGradient id="brassSoft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DEC07E"/>
      <stop offset="40%" stop-color="#C8A45A"/>
      <stop offset="100%" stop-color="#8C6F2D"/>
    </linearGradient>

    <linearGradient id="trunkLeather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4E2B18"/>
      <stop offset="40%" stop-color="#3B1E10"/>
      <stop offset="100%" stop-color="#241209"/>
    </linearGradient>

    <linearGradient id="strapLeather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22130A"/>
      <stop offset="100%" stop-color="#140A04"/>
    </linearGradient>

    <linearGradient id="briefcaseGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B3828"/>
      <stop offset="40%" stop-color="#12271C"/>
      <stop offset="100%" stop-color="#0B1711"/>
    </linearGradient>

    <linearGradient id="ibmBezel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#332F2B"/>
      <stop offset="50%" stop-color="#25221F"/>
      <stop offset="100%" stop-color="#171513"/>
    </linearGradient>
  </defs>

  <!-- Panel Base: Deep Warm Leather/Wood (#17130F) with Hairline Border -->
  <rect x="0.5" y="0.5" width="829" height="231" rx="10" fill="#17130F" stroke="#3A3126" stroke-width="1"/>
  <rect x="4.5" y="4.5" width="821" height="223" rx="7" fill="none" stroke="#251E17" stroke-width="0.8"/>

  <!-- Left Content Column -->
  <g transform="translate(36, 0)">
    <!-- Label: // secbymorchid -->
    <text x="0" y="38" font-family="ui-monospace, 'SF Mono', Consolas, Menlo, monospace" font-size="13" font-weight="600" fill="#C8A45A" letter-spacing="2px">// SECBYMORCHID</text>

    <!-- IBM Boot Line above name with Block Cursor in Phosphor Green #8FBF9F -->
    <text x="0" y="62" font-family="ui-monospace, 'SF Mono', Consolas, Menlo, monospace" font-size="14" font-weight="600" fill="#8FBF9F">&gt; IBM 5100 · MGSI.OS · READY <tspan fill="#8FBF9F">&#9608;</tspan></text>

    <!-- Regal Executive Headline -->
    <text x="0" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="#EFE8D8" letter-spacing="1.5px">MOAD MORCHID</text>

    <!-- Hairline Brass Accent Rule -->
    <line x1="0" y1="130" x2="160" y2="130" stroke="#C8A45A" stroke-width="1.2" opacity="0.7"/>
    <line x1="160" y1="130" x2="520" y2="130" stroke="#3A3126" stroke-width="1"/>

    <!-- Subtitle (One clean line, comfortable breathing space, never cut off) -->
    <text x="0" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#EFE8D8">Information Systems Governance · Risk &amp; Cyber Assessment · IT Project Management</text>

    <!-- Student Affiliation -->
    <text x="0" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="400" fill="#BDB29C">MGSI engineering student at ENSA Oujda</text>
  </g>

  <!-- Right Visual: Signature Old Money Leather & Calmed IBM Terminal Enclave -->
  <g transform="translate(620, 30) scale(0.47)">
    <ellipse cx="205" cy="254" rx="195" ry="12" fill="#000000" opacity="0.45"/>
    <rect x="0" y="248" width="415" height="12" rx="2" fill="#18110B" stroke="#2B1A10" stroke-width="1"/>
    <line x1="0" y1="248" x2="415" y2="248" stroke="#C8A45A" stroke-width="0.8" stroke-opacity="0.25"/>

    <!-- 1. The Heritage Cognac Steamer Trunk -->
    <g id="cognacTrunk">
      <rect x="8" y="160" width="398" height="88" rx="6" fill="url(#trunkLeather)" stroke="#3A1C0B" stroke-width="1.2"/>
      <line x1="14" y1="162" x2="400" y2="162" stroke="#FFFFFF" stroke-width="0.6" opacity="0.08"/>

      <line x1="8" y1="184" x2="406" y2="184" stroke="#140803" stroke-width="2"/>
      <line x1="8" y1="185.5" x2="406" y2="185.5" stroke="#C8A45A" stroke-width="0.5" stroke-opacity="0.35"/>

      <!-- Vertical Leather Straps -->
      <rect x="74" y="160" width="22" height="88" fill="url(#strapLeather)" stroke="#100602" stroke-width="0.8"/>
      <line x1="77" y1="160" x2="77" y2="248" stroke="#C8A45A" stroke-dasharray="2,2" stroke-width="0.6" stroke-opacity="0.6"/>
      <line x1="93" y1="160" x2="93" y2="248" stroke="#C8A45A" stroke-dasharray="2,2" stroke-width="0.6" stroke-opacity="0.6"/>
      <rect x="71" y="179" width="28" height="12" rx="2" fill="none" stroke="url(#brassSoft)" stroke-width="1.6"/>
      <line x1="85" y1="179" x2="85" y2="191" stroke="#E8D29B" stroke-width="1.2"/>

      <rect x="318" y="160" width="22" height="88" fill="url(#strapLeather)" stroke="#100602" stroke-width="0.8"/>
      <line x1="321" y1="160" x2="321" y2="248" stroke="#C8A45A" stroke-dasharray="2,2" stroke-width="0.6" stroke-opacity="0.6"/>
      <line x1="337" y1="160" x2="337" y2="248" stroke="#C8A45A" stroke-dasharray="2,2" stroke-width="0.6" stroke-opacity="0.6"/>
      <rect x="315" y="179" width="28" height="12" rx="2" fill="none" stroke="url(#brassSoft)" stroke-width="1.6"/>
      <line x1="329" y1="179" x2="329" y2="191" stroke="#E8D29B" stroke-width="1.2"/>

      <!-- Center Brass Clasp -->
      <rect x="190" y="174" width="34" height="24" rx="3" fill="url(#brassSoft)" stroke="#6B5117" stroke-width="0.8"/>
      <rect x="201" y="170" width="12" height="9" rx="1.5" fill="url(#brassSoft)" stroke="#6B5117" stroke-width="0.6"/>
      <circle cx="207" cy="183" r="2.2" fill="#170E07"/>

      <!-- Brass Corner Reinforcements -->
      <path d="M 8 180 L 8 162 A 2 2 0 0 1 10 160 L 28 160 L 28 168 L 16 168 L 16 180 Z" fill="url(#brassSoft)"/>
      <path d="M 406 180 L 406 162 A 2 2 0 0 0 404 160 L 386 160 L 386 168 L 398 168 L 398 180 Z" fill="url(#brassSoft)"/>
      <path d="M 8 228 L 8 246 A 2 2 0 0 0 10 248 L 28 248 L 28 240 L 16 240 L 16 228 Z" fill="url(#brassSoft)"/>
      <path d="M 406 228 L 406 246 A 2 2 0 0 1 404 248 L 386 248 L 386 240 L 398 240 L 398 228 Z" fill="url(#brassSoft)"/>
    </g>

    <!-- 2. British Racing Green Leather Briefcase -->
    <g id="greenBriefcase" transform="translate(18, 92)">
      <rect x="0" y="0" width="220" height="70" rx="5" fill="url(#briefcaseGreen)" stroke="#0E1E15" stroke-width="1"/>
      <line x1="4" y1="2" x2="216" y2="2" stroke="#FFFFFF" stroke-width="0.5" opacity="0.08"/>
      <path d="M 0 0 L 0 28 Q 110 38 220 28 L 220 0 Z" fill="#142B1E" stroke="#0A160F" stroke-width="0.8"/>
      <rect x="100" y="24" width="20" height="15" rx="2" fill="url(#brassSoft)" stroke="#6B5117" stroke-width="0.6"/>
      <circle cx="110" cy="30" r="1.5" fill="#0E1A12"/>
      <rect x="42" y="0" width="13" height="70" fill="#0E1E15" opacity="0.6"/>
      <rect x="165" y="0" width="13" height="70" fill="#0E1E15" opacity="0.6"/>
      <path d="M 85 0 C 85 -16 135 -16 135 0" fill="none" stroke="#0E1E15" stroke-width="5" stroke-linecap="round"/>
      <path d="M 85 0 C 85 -16 135 -16 135 0" fill="none" stroke="#1B3828" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- 3. IBM 5100 Portable Computer Enclave -->
    <g id="ibmTerminal" transform="translate(230, 70)">
      <path d="M 0 92 L 18 10 L 152 10 L 168 92 Z" fill="url(#ibmBezel)" stroke="#1A1816" stroke-width="1"/>
      <path d="M 0 92 L 6 96 L 162 96 L 168 92 Z" fill="#1A1816"/>

      <!-- CRT Display Bezel -->
      <rect x="18" y="20" width="76" height="58" rx="6" fill="#141311" stroke="#2B2723" stroke-width="1.2"/>
      <!-- Soft Phosphor Screen (Zero neon glare) -->
      <rect x="22" y="24" width="68" height="50" rx="3" fill="#0B1A12" stroke="#122B1E" stroke-width="0.8"/>
      <!-- Internal Screen Telemetry Text -->
      <text x="26" y="36" font-family="ui-monospace, monospace" font-size="6.5" font-weight="600" fill="#8FBF9F" letter-spacing="0.3px">&gt; MGSI.SYS</text>
      <text x="26" y="46" font-family="ui-monospace, monospace" font-size="5.5" fill="#75A283">GOV: ACTIVE</text>
      <text x="26" y="55" font-family="ui-monospace, monospace" font-size="5.5" fill="#75A283">RISK: NOMINAL</text>
      <text x="26" y="65" font-family="ui-monospace, monospace" font-size="6" font-weight="700" fill="#8FBF9F">READY_</text>

      <!-- IBM Tape Drive Slot -->
      <rect x="102" y="24" width="50" height="22" rx="2" fill="#12100E" stroke="#2B2723" stroke-width="0.8"/>
      <line x1="106" y1="35" x2="148" y2="35" stroke="#000000" stroke-width="2"/>
      <circle cx="112" cy="41" r="1.5" fill="#C8A45A"/>
      <circle cx="118" cy="41" r="1.5" fill="#8FBF9F"/>

      <!-- IBM Badge -->
      <text x="103" y="18" font-family="Georgia, serif" font-size="6" font-weight="700" fill="#C8A45A" letter-spacing="1px">IBM 5100</text>

      <!-- Mainframe Terminal Keybed -->
      <g transform="translate(10, 78)">
        <rect x="0" y="0" width="148" height="12" rx="1.5" fill="#12100E" stroke="#25211D" stroke-width="0.8"/>
        <line x1="6" y1="4" x2="142" y2="4" stroke="#25211D" stroke-width="2" stroke-dasharray="3, 1.5"/>
        <line x1="6" y1="8" x2="142" y2="8" stroke="#25211D" stroke-width="2" stroke-dasharray="3, 1.5"/>
      </g>
    </g>
  </g>
</svg>