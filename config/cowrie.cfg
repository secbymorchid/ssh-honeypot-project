# ==============================================================================
# Enterprise Cowrie SSH Honeypot Configuration
# Architecture: Low-Interaction Honeypot (Simulating Linux Server)
# Purpose: Threat Intelligence & Attack Telemetry Generation
# ==============================================================================

[honeypot]
# Simulated hostname displayed in prompts and banners
hostname = srv-ubuntu-prod-01

# Virtual OS and architecture emulation
fake_addr = 192.168.1.105
reported_ssh_port = 22
kernel_version = 5.15.0-89-generic
kernel_build_string = #99-Ubuntu SMP Mon Oct 23 13:16:00 UTC 2023
hardware_platform = x86_64
operating_system = GNU/Linux

# Interactive session limits to prevent local resource starvation
interactive_timeout = 180
authentication_timeout = 60
backend = shell

# File handling (capture payloads uploaded via scp / sftp / curl / wget)
download_limit_size = 10485760

[ssh]
# Honeypot listening port (mapped to host 2222 or redirected via iptables from 22)
listen_endpoints = tcp:2222:interface=0.0.0.0
version = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.4
ciphers = chacha20-poly1305@openssh.com,aes128-ctr,aes192-ctr,aes256-ctr,aes128-gcm@openssh.com,aes256-gcm@openssh.com
macs = umac-64-etm@openssh.com,umac-128-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com

[telnet]
# Telnet is disabled to focus exclusively on SSH threat vectors
enabled = false

[output_jsonlog]
# Primary structured telemetry engine (NDJSON format consumed by parse_logs.py and SIEM)
enabled = true
logfile = var/log/cowrie/cowrie.json
epoch_timestamp = false
