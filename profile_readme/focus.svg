<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 190" width="830" height="190">
  <!-- Panel Base: Rounded #17130F with Hairline Border -->
  <rect x="0.5" y="0.5" width="829" height="189" rx="8" fill="#17130F" stroke="#3A3126" stroke-width="1"/>
  <rect x="5.5" y="5.5" width="819" height="179" rx="5" fill="none" stroke="#251E17" stroke-width="0.8"/>

  <!-- Section Label -->
  <text x="32" y="34" font-family="ui-monospace, 'SF Mono', Consolas, Menlo, monospace" font-size="13" font-weight="600" fill="#C8A45A" letter-spacing="1.5px">// CORE FOCUS &amp; METHODOLOGY</text>
  <line x1="32" y1="46" x2="798" y2="46" stroke="#3A3126" stroke-width="1"/>

  <!-- Row 1: Governance & Risk -->
  <g transform="translate(32, 80)">
    <text x="0" y="0" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" fill="#C8A45A">Governance &amp; Risk</text>
    <text x="290" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#EFE8D8">ISO 27001, EBIOS RM, GDPR/RGPD, risk assessment</text>
  </g>

  <!-- Row 2: Information Systems Architecture -->
  <g transform="translate(32, 120)">
    <text x="0" y="0" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" fill="#C8A45A">IS Architecture</text>
    <text x="290" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#EFE8D8">UML, Merise, SAP PowerDesigner</text>
  </g>

  <!-- Row 3: Security Operations -->
  <g transform="translate(32, 160)">
    <text x="0" y="0" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" fill="#C8A45A">Security Operations</text>
    <text x="290" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#EFE8D8">SIEM pipelines, Linux hardening, threat detection</text>
  </g>
</svg>